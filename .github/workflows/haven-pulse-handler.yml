name: haven-pulse-handler
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/haven-pulse-handler.yml'
      - 'haven-pulse-handler.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@107.175.135.139:6580"
        - os: windows-2025
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@31.58.23.2:5575"
        - os: windows-2022
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@173.211.69.90:6683"
        - os: ubuntu-24.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@202.155.186.127:6538"
        - os: ubuntu-22.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@46.202.224.240:5792"
        - os: ubuntu-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@38.154.199.57:5211"
        - os: ubuntu-20.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@142.111.113.197:6558"
        - os: windows-2025
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@142.147.128.219:6719"
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@13.143.125.88:7130"
        - os: windows-latest
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@206.127.212.253:6231"
        - os: ubuntu-latest
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@136.0.126.245:6006"
        - os: ubuntu-20.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@154.6.23.176:6643"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@64.137.101.11:5325"
        - os: ubuntu-22.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@46.203.134.3:5627"
        - os: windows-2022
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@104.253.55.229:5659"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run haven-pulse-handler.js "${{ matrix.proxy }}" || true
          else
            npm install
            node haven-pulse-handler.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run haven-pulse-handler.js "${{ matrix.proxy }}"
          } else {
            npm install
            node haven-pulse-handler.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline haven-pulse-handler finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
