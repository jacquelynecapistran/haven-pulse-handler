name: haven-pulse-handler
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/haven-pulse-handler.yml'
      - 'haven-pulse-handler.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2025
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@45.39.20.168:5597"
        - os: ubuntu-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@13.143.125.88:7130"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@82.22.211.158:5966"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@82.22.253.210:8068"
        - os: ubuntu-24.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@82.27.245.13:6336"
        - os: windows-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@104.239.23.192:5953"
        - os: ubuntu-22.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@148.135.178.190:5751"
        - os: ubuntu-20.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@173.211.0.222:6715"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@107.175.135.139:6580"
        - os: ubuntu-22.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@119.42.39.148:5776"
        - os: windows-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@191.101.94.54:6024"
        - os: windows-2025
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@142.111.124.238:6258"
        - os: ubuntu-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@104.233.26.134:5972"
        - os: ubuntu-24.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@94.176.212.102:6618"
        - os: windows-2022
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@103.251.223.209:6188"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run haven-pulse-handler.js "${{ matrix.proxy }}" || true
          else
            npm install
            node haven-pulse-handler.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run haven-pulse-handler.js "${{ matrix.proxy }}"
          } else {
            npm install
            node haven-pulse-handler.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline haven-pulse-handler finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
