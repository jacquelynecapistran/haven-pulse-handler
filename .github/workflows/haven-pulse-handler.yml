name: haven-pulse-handler
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/haven-pulse-handler.yml'
      - 'haven-pulse-handler.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2025
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@46.203.134.3:5627"
        - os: windows-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@82.26.246.140:7964"
        - os: ubuntu-latest
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@104.253.77.160:5582"
        - os: ubuntu-20.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@206.232.75.3:6573"
        - os: ubuntu-22.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@154.6.23.176:6643"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@82.22.209.181:6011"
        - os: ubuntu-24.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@206.206.118.46:6284"
        - os: windows-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@89.116.71.122:6088"
        - os: ubuntu-24.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@195.40.70.40:6723"
        - os: ubuntu-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@38.154.199.57:5211"
        - os: windows-2025
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@198.20.185.230:5600"
        - os: ubuntu-20.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@188.68.1.245:6114"
        - os: windows-2022
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@45.38.89.78:6013"
        - os: ubuntu-22.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@94.176.212.102:6618"
        - os: windows-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@82.23.237.148:7482"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run haven-pulse-handler.js "${{ matrix.proxy }}" || true
          else
            npm install
            node haven-pulse-handler.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run haven-pulse-handler.js "${{ matrix.proxy }}"
          } else {
            npm install
            node haven-pulse-handler.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline haven-pulse-handler finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
